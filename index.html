<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Hermes Inbox</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #232323;
        color: #E5E5E5;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app { padding: 20px; max-width: 620px; }
      h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; color: #7dd37d; margin: 0 0 4px; }
      p.sub { margin: 0 0 18px; color: #9a9a9a; font-size: 12px; }
      .msg { border: 1px solid #3a3a3a; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
      .msg b { color: #E5E5E5; }
      .msg small { color: #8f8f8f; display: block; margin-top: 6px; }
      code { background: #2c2c2c; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>HERMES INBOX</h1>
      <p class="sub">The glasses render the message. This page is just the companion surface — it lists what has been sent so you can confirm the feed contents.</p>
      <div id="messages">loading...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module">
      const box = document.getElementById('messages')
      const load = async () => {
        try {
          const feed = await (await fetch('/messages.json', { cache: 'no-store' })).json()
          box.innerHTML = feed.messages.map(m =>
            `<div class="msg"><b>${m.text}</b><br>${m.detail ?? ''}<small>#${m.id} · ${m.ts ?? ''}</small></div>`
          ).join('') || '<div class="msg">no messages</div>'
        } catch (e) {
          box.textContent = 'could not load feed: ' + e
        }
      }
      load()
      setInterval(load, 5000)
    </script>
  </body>
</html>
