<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Mockup of the G2 canvas, so the layout is visible without hardware.
         The device font is an LVGL bitmap face baked into firmware; this uses a
         system font as a stand-in, so glyph shapes differ. Geometry, brightness
         hierarchy and copy are exact. */
      .wrap { font: 13px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
              color: var(--foreground, #e5e5e5); }
      .cap { color: var(--muted-foreground, #9a9a9a); margin-bottom: 10px; }
      .cap b { color: var(--foreground, #e5e5e5); font-weight: 600; }
      .glasses {
        width: 576px; height: 288px;
        background: #000;
        border: 1px solid var(--border, #3a3a3a);
        box-sizing: border-box;
        display: flex; flex-direction: column;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      /* title container: y=0 h=40, borderWidth 0, textColor 2 (dim) */
      .title {
        height: 40px; box-sizing: border-box; padding: 6px;
        display: flex; align-items: center;
        color: #00ff00; opacity: .55;
        font-size: 13px; letter-spacing: .12em; font-weight: 600;
      }
      /* body container: y=44 h=244, borderWidth 1 @ level 5, padding 8, textColor 4 (bright) */
      .body {
        height: 244px; box-sizing: border-box; margin: 0;
        border: 1px solid rgba(0,255,0,.35);
        padding: 8px;
        color: #00ff00;
        font-size: 14px; line-height: 1.55;
        white-space: pre-wrap;
      }
      .body .meta { opacity: .55; }
      .chip { display:inline-block; border:1px solid var(--border,#3a3a3a); border-radius:999px;
              padding:2px 9px; font-size:11px; color:var(--muted-foreground,#9a9a9a); margin-right:6px }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="cap">
        <span class="chip">576 × 288</span><span class="chip">4-bit green</span><span class="chip">2 containers</span><br>
        <b>What the glasses render</b> — the body container holds the newest feed message.
      </div>
      <div class="glasses">
        <div class="title">HERMES INBOX</div>
        <div class="body">Hello World

Third message — this one was pushed by tools/send.py at 13:22Z, not hand-written into the bundle.

<span class="meta">from Hermes  ·  09-13 13:22Z  ·  1/3
Tap: next  ·  Double-tap: exit</span></div>
      </div>
    </div>
  </body>
</html>
